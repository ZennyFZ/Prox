name: Proxy refresh

on:
  schedule:
    - cron: "0 7,15,23 * * *"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proxy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install aiohttp
        run: python -m pip install --disable-pip-version-check aiohttp
      - name: Generate proxy results
        run: python filter_proxies.py --out good_proxies.txt
      - name: Commit and push results when changed
        run: |
          git add -- good_proxies.txt
          if git diff --cached --quiet -- good_proxies.txt; then
            echo "No result changes; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh working proxy list"
          git push
